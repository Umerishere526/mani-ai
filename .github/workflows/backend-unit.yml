# ABOUTME: Runs the backend's unit tests (deterministic logic, the regression suite's checks included) on every push
# ABOUTME: and pull request that touches backend/. No database, no model calls, no secrets.
name: backend unit tests

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-unit.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-unit.yml"]

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/unit -q
