[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto

# Warnings are failures, so a deprecation in our own code cannot be ignored into
# the noise. The exceptions below are third-party and scoped to one message each:
# starlette's test client imports a deprecated anyio alias on import; langchain-openai's structured
# stream serializes a chunk whose `parsed` field it types as None (the reply is intact, the warning
# is the library's, and the cause is upstream).
filterwarnings =
    error
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ignore:(?s).*field_name='parsed':UserWarning
