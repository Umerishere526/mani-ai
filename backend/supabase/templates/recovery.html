<!-- ABOUTME: The password-reset email: a six-digit code, not a link. -->
<!-- ABOUTME: A code works wherever the app is running; a link only works where the redirect allows. -->
<h2>Reset your password</h2>

<p>Enter this code to choose a new password:</p>

<p style="font-size: 28px; letter-spacing: 6px; font-weight: 700; margin: 24px 0;">
  {{ .Token }}
</p>

<p>It expires in an hour. If you did not ask for this, nothing has changed and you can ignore this email.</p>
