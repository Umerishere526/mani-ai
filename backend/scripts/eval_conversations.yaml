# ABOUTME: Scripted conversations for scripts/eval_replies.py, one per named scenario.
# ABOUTME: Turns are drawn from the framework files' own worked examples where possible.

- name: anxiety_free_chat
  turns:
    - "I have a presentation tomorrow and I keep going over it"
    - "I keep thinking I'll freeze halfway through"
    - "I don't know, I just want it to be over"
    - "yeah maybe"
- name: criticism_abcde
  turns:
    - "My manager criticized my presentation in front of everyone"
    - "She said two of my recommendations did not have enough support"
    - "I stopped speaking and avoided her afterward"
    - "I keep thinking I am incompetent"
- name: withdrawal_behavioral_activation
  turns:
    - "I have been in bed all day"
    - "I have ignored everyone's messages for a week"
    - "I don't see the point"
    - "I guess I could answer one"

# Steering: from the first message the questions should be heading toward a set of questions,
# so that an offer can come as soon as the client's cadence allows. Turns from real chats.
- name: grief_dog_steering
  turns:
    - "I'm sad that my dog died and i am feeling too lonely"
    - "it feels empty like i don't have anyone with me now. i live alone in a flat"
    - "his presences in my day to day life"
    - "i loved him man, he was cheerful and helped me through rough times"
    - "with good memories i guess"
- name: deadlines_steering
  turns:
    - "I am behind on everything and do not know where to begin"
    - "work, my landlord, and a family thing"
    - "the report at work is due Friday and my manager already asked twice"
    - "I guess I could ask for more time or just work all weekend"
    - "I do not know which is better"

# Vague openings and one-word replies: the questions should clarify, not stall, and a person
# who says they already said something must be met with that, not asked again.
- name: pain_vague_clarification
  turns:
    - "i'm in pain"
    - "i can't focus on work and everything seem to be taking a toll on me"
    - "just told you the pain"
    - "yeah"
    - "i don't know"

# muhammad's chat, 2026-10-01: an exam in 24 hours. The problem is clear by the second message,
# so the offer should not wait for a vague reply, and once the questions start every one of
# them must be about the exam, including after "I've already told you".
- name: exam_start_keeps_context
  turns:
    - "i've an exam in next 24 hours and i don't know where to start i have not studied at all."
    - "i'm not sure, i'm confused between hittin the books from the start or just target specific topic."
    - "@accept|yes please"
    - "@accept|yes"
    - "i've already told you my situation."
    - "my prep for exams"
    - "i have a textbook and my class notes"

# muhammad's chat, 2026-10-01, typos kept: a colleague questioned two recommendations. Replies went
# out with no question, and the offer came at message 7. Every reply before an offer must ask one
