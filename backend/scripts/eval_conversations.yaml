# ABOUTME: Scripted conversations for scripts/eval_replies.py, one per named scenario.
# ABOUTME: Each scenario's turns are what the person types, in order, one string per turn.

- name: anxiety_free_chat
  baseline: true
  turns:
    - "I have a presentation tomorrow and I keep going over it"
    - "I keep thinking I'll freeze halfway through"
    - "I don't know, I just want it to be over"
    - "yeah maybe"
- name: criticism_abcde
  baseline: true
  turns:
    - "My manager criticized my presentation in front of everyone"
    - "She said two of my recommendations did not have enough support"
    - "I stopped speaking and avoided her afterward"
    - "I keep thinking I am incompetent"
- name: withdrawal_behavioral_activation
  turns:
    - "I have been in bed all day"
    - "I have ignored everyone's messages for a week"
    - "I don't see the point"
    - "I guess I could answer one"

# Steering: from the first message the questions should be heading toward a set of questions,
# so that an offer can come as soon as the client's cadence allows. Turns from real chats.
# An offer waits for the person's second message and for the model to judge that a set fits,
# whatever words they used.
- name: grief_dog_steering
  turns:
    - "I'm sad that my dog died and i am feeling too lonely"
    - "it feels empty like i don't have anyone with me now. i live alone in a flat"
    - "his presences in my day to day life"
    - "i loved him man, he was cheerful and helped me through rough times"
    - "with good memories i guess"
- name: deadlines_steering
  turns:
    - "I am behind on everything and do not know where to begin"
    - "work, my landlord, and a family thing"
    - "the report at work is due Friday and my manager already asked twice"
    - "I guess I could ask for more time or just work all weekend"
    - "I do not know which is better"

# Vague openings and one-word replies: the questions should clarify, not stall, and a person
# who says they already said something must be met with that, not asked again.
- name: pain_vague_clarification
  turns:
    - "i'm in pain"
    - "i can't focus on work and everything seem to be taking a toll on me"
    - "just told you the pain"
    - "yeah"
    - "i don't know"

# muhammad's chat, 2026-10-01: an exam in 24 hours. The problem is clear by the second message,
# so the offer should not wait for a vague reply, and once the questions start every one of
# them must be about the exam, including after "I've already told you".
- name: exam_start_keeps_context
  turns:
    - "i've an exam in next 24 hours and i don't know where to start i have not studied at all."
    - "i'm not sure, i'm confused between hittin the books from the start or just target specific topic."
    - "@accept|yes please"
    - "@accept|yes"
    - "i've already told you my situation."
    - "my prep for exams"
    - "i have a textbook and my class notes"

# muhammad's chat, 2026-10-01, typos kept: a colleague questioned two recommendations. Replies went
# out with no question, and the offer came at message 7. Every reply before an offer must ask one
# question, and the fit (ABCDE or Thought Reframe) is clear by the third or fourth message.
- name: colleague_questioned
  turns:
    - "my colleague questioned two of my recommendations in front of the team."
    - "i felt emberessed and i didn't know how to handle my emotions."
    - "i feel like she didn't have to point me out in the meeting she could have told me offline"
    - "i felt embarrased and just wanted to disappear"
    - "i feels like i'm not enough. and my work is not appreactatied"
    - "that i can do more but i am doing the best i can"

# muhammad's chat, 2026-10-01: a lost wallet, panicking. Mani asked "is that the problem you want to
# resolve?", asked for the person's own options four times running, and only suggested anything at the
# end. Once a framework starts: no confirmation of what they just said, and an "I don't know" about
# what to do is met with a few concrete options, the urgent protective step first.
- name: lost_wallet_panic
  turns:
    - "i lost my wallet and i am panicking and anxious. my wallet had my ID card, credit cards and ATM cards and 2000 dollars in it"
    - "i don't remember, i visited many places today and called the restaurants i went to but none of them have it"
    - "@accept|yes please"
    - "@accept|yes"
    - "they are all active"
    - "i don't know"
    - "i don't know"
    - "please guide me, what should i do"

# Observed 2026-10-01 (muhammad's chat, comparing themselves with others online): after Yes, let's try it Mani asked
# "why does getting back to doing things that feel productive matter?" before anything specific had
# been named, then answered "pick one for me" and "yes, but what should I start with?" with the same
# three options twice. The first stage is skipped only when it is answered, a request to pick gets one
# draft step to accept or change, and the framework still runs to its end.
- name: productive_cannot_choose
  expect_framework: true
  turns:
    - "today i don't feel it to win anything and just want to lay in my bed"
    - "I feel it in much behind everyone. like when i view the social media i see some people travel, some people flexing their money, their wealth and their easy life. it makes me feel small inside. i want to work for it, i procastinate and loss motivation. and sometimes i don't even want to try as i feel like i'm so behind why even bother with it."
    - "it like they have everything i.e money, fame, love, respect. everything basically."
    - "i want to do alot like make my day as productive as i can. but i just waste doom scrolling on social media or just lazying around."
    - "@accept|yes"
    - "@accept|yes"
    - "i feel like i should be learning new thing, exploring new opportunities, travel etc."
    - "i'm not sure. when ever i decide on a thing it feels like i just can't do it and quit before i even start."
    - "yes, they do what should i start with?"
    - "not sure can you please pick one for me."
    - "yes, but what should i start with?"
    - "yes that works"
    - "tomorrow morning after breakfast"
    - "i might pick up my phone and scroll instead"
    - "i'll put the phone in another room"
    - "yes it feels doable"
    - "yes, that is a realistic plan for me"
    - "my shoulders feel a bit looser"
    - "it was a good place to stop"

# A question is not what every moment needs. These turns are the ones where asking another
# would be the failure, so they are the only place the question-free shapes can be observed.
- name: disclosure_no_question_needed
  heard: true
  turns:
    - "nobody in my family knows about any of this"
    - "please don't give me a technique right now, I just need to get it out"
    - "I keep replaying the argument and I still can't see where it went wrong"
    - "that's all I wanted to say"

# The client's own worked scenarios (docs/specs/conversational-styles.md). The anxiety and
# overthinking user turns are the document's; the scrolling and stress turns differ from it.
# Their MANI lines are the target: compare side by side with --verbose.
- name: client_anxiety
  turns:
    - "I feel like I might have a panic attack."
    - "My chest feels tight, my thoughts are racing, and I feel like I'm losing control."
    - "The feeling that I'm losing control."
- name: client_overthinking
  turns:
    - "I'm upset."
    - "My best friend sent me a text and now I think she hates me."
    - "She was really short with me and ended the conversation. Now I keep replaying it and wondering what I did wrong."
- name: client_scrolling
  turns:
    - "I cannot stop scrolling, but I need to."
    - "I have work due tomorrow and I've been on my phone for three hours."
    - "Every time I try to start I just pick the phone back up."
- name: client_stress
  turns:
    - "I'm trying to balance work, family, and everything else, and I have a deadline coming up."
    - "I don't know where to start."
    - "Mostly the deadline. It's on Friday and I haven't begun."
# The client's job decision conversation (feedback of 2026-10-08), run once per style (spec 0016).
# Their principle: understand the problem, introduce the set naturally, use what they already shared.
- name: client_job_decision
  turns:
    - "I'm facing an important decision, and I keep going back and forth. Every time I think I've made up my mind, I start questioning myself again. I'm frustrated because I don't understand why I can't just decide."
    - "I'm trying to decide whether to accept a new job opportunity or stay where I am. There are good reasons for both, and I'm afraid of making the wrong choice."
    - "The new job offers better pay and more responsibility, but I've been at my current company for years. I know the people, I'm comfortable there, and I'm worried I might regret leaving."
    - "@accept|I just want to stop going back and forth and be able to decide."
    - "@accept|Okay, let's try it."

# Inside a framework: starts with ABCDE accepted, then answers its stages the way a person would.
- name: framework_abcde_stages
  start_in: {framework: abcde, phase: activating_event}
  turns:
    - "My manager criticized my presentation in front of the whole team."
    - "She said two of my recommendations didn't have enough support."
    - "That I'm bad at my job and everyone saw it."
    - "I stopped talking for the rest of the meeting and avoided her after."
    - "Well, she also asked me to lead the next project, so maybe not everyone thinks that."

# ---------------------------------------------------------------------------
# `@accept|<line>` taps the offer when there is one, otherwise says <line>. `@more|<line>` taps Tell Me More the same way.
# `@accept|<line>` taps the offer when there is one, otherwise says <line>.
# `@tap:<label>` taps a named button. `@newchat` folds memory and opens a second chat.
# ---------------------------------------------------------------------------

- name: journey_abcde
  baseline: true
  expect_framework: true
  expect_after_questions: true
  turns:
    - "My manager criticized my presentation in front of the whole team."
    - "She said two of my recommendations didn't have enough support, and now I keep thinking I'm bad at my job."
    - "@accept|It keeps going round in my head and I'd like to work through it."
    - "@accept|Yes, I want to look at it properly."
    - "@accept|Okay."
    - "She said it in the meeting, right after my slides, in front of everyone."
    - "That I'm bad at my job and everyone saw it."
    - "I stopped talking for the rest of the meeting and avoided her afterwards."
    - "She also asked me to lead the next project, so maybe not everyone thinks that."
    - "Maybe one presentation had gaps, but it doesn't mean I'm bad at my job."
    - "Yes, that feels fairer."
    - "My shoulders feel a bit looser than when we started."
    - "@tap:Chat More"
    - "I still keep thinking about that meeting though."
    - "I guess I want to stop letting one comment decide how I feel about my work."
    - "Maybe I could ask her for feedback before the next presentation."

# Tell Me More before Try It: the reply after Try It must neither list the five steps again nor ask
# for the event they already gave (client ABCDE doc, Tell Me More). Run in Reflective (spec 0015).
- name: abcde_told_more
  turns:
    - "My manager criticized my presentation in front of the whole team."
    - "She said two of my recommendations didn't have enough support, and now I keep thinking I'm bad at my job."
    - "@more|It keeps going round in my head and I'd like to work through it."
    - "@more|Yes, I want to look at it properly."
    - "@accept|Okay, let's try it."
    - "That I'm bad at my job and everyone saw it."
    - "I stopped talking for the rest of the meeting and avoided her afterwards."

# muhammad's own chat, 2026-09-24: on "Yes, let's try it", Mani asked which problem to work on first, right
# after being told. The reply after @accept must build on it, not ask again.
- name: start_keeps_context
  turns:
    - "My coworker is a pain."
    - "They take the credit for my work and present it as their own."
    - "@accept|It's exhausting. I do all the work and never get the credit for it."
    - "@accept|I'd like to do something about it."
    - "@accept|Okay."
    - "Yes, that's the one."
- name: journey_behavioral_activation
  expect_framework: true
  turns:
    - "I've been in bed most of the week and I've stopped answering my friends."
    - "I know I should get up and text them back but I can't make myself start."
    - "@accept|It's been like this for days and I want to change it."
    - "@accept|Yes, I'd like help with it."
    - "@accept|Okay."
    - "Replying to my friends, going for walks, cooking properly."
    - "My friends matter to me, I don't want to lose them."
    - "Replying to my friend Jo would be the one."
    - "Just sending her one short message."
    - "Tonight after dinner."
    - "I might feel embarrassed that I took so long, so I'll just say sorry I've been quiet."
    - "Yes, that feels doable."
    - "A bit lighter in my chest."
    - "@tap:Chat More"
    - "Thank you."

- name: open_breakup
  turns:
    - "My partner and I broke up last week."
    - "I keep checking my phone hoping they'll text."
    - "I just feel empty."
# muhammad's own chat, 2026-09-24: Supportive asked only about the situation and named
# feelings he never gave ("worried", "afraid", "fear").
- name: open_losing_someone
  turns:
    - "i am hurt"
    - "i just have a sinking feeling in my heart that i am going to lose something important to me"
    - "someone close to me"
    - "they are in poor health and i don't know what i can do to ease their pain"
    - "it hurts to see them like this"
- name: open_exam
  turns:
    - "I have an exam on Friday and I can't focus."
    - "Every time I sit down I start thinking I'm going to fail."
    - "I studied but it never feels like enough."
- name: open_lonely_move
  turns:
    - "I moved to a new city a month ago and I don't really know anyone."
    - "Evenings are the worst."
    - "I'm not sure how people make friends as an adult."
- name: open_family_argument
  turns:
    - "I had a big argument with my mum."
    - "She said I never make time for the family."
    - "I'm annoyed but I also feel bad."
- name: open_sleep
  turns:
    - "I can't sleep."
    - "My mind won't switch off when I lie down."
    - "It's been like this for about two weeks."
- name: open_procrastination
  turns:
    - "I keep putting off a report that's due Monday."
    - "I open it and then I just go do something else."
    - "I don't even know why."
- name: open_unclear
  turns:
    - "I don't know what's wrong with me lately."
    - "I'm just not myself."
    - "Nothing specific happened."
- name: open_hi
  turns:
    - "hi"
    - "not much, just wanted to talk"
    - "work was long today."

- name: returning_person
  markers: ["sunday", "walk"]
  turns:
    - "I always feel low on Sunday nights before the work week starts."
    - "It's the dread of Monday, all the meetings."
    - "Going for a walk in the afternoon sometimes helps."
    - "@newchat"
    - "Hey, I'm back."
    - "Work has been stressful again this week."
    - "I don't really know what to do about it."

- name: journey_thought_reframe
  expect_framework: true
  turns:
    - "My friend hasn't replied to my message for two days."
    - "I keep thinking she doesn't care about me anymore."
    - "@accept|That thought won't leave me alone, I'd like to look at it."
    - "@accept|Yes, I want to work through it."
    - "@accept|Okay."
    - "That she doesn't care about me."
    - "It makes me feel like I don't matter to her."
    - "Well, she did start a new job this week."
    - "Maybe she's just swamped, not ignoring me."
    - "She's busy and hasn't replied yet, but that doesn't mean she doesn't care."
    - "Yes, that feels fairer."
    - "My stomach feels less tight than before."
    - "@tap:Chat More"
    - "Thanks."

# Offer to end for the frameworks with no journey above: one line per stage, in order.
- name: journey_structured_problem_solving
  expect_framework: true
  turns:
    - "I missed the report deadline at work and now there are three more things due this week."
    - "I don't know what to do first, everything is a mess and I need to make a plan."
    - "@accept|I really need a way through this week."
    - "@accept|Yes, let's work it out."
    - "@accept|Okay."
    - "The late report is the main thing, the rest can wait a day."
    - "My manager knows it's late, but I don't know when she needs it by now."
    - "I can ask her for a new date and decide what to drop this week."
    - "I want the report done properly without missing the other deadlines."
    - "I could finish it tonight, ask for two more days, or hand in a shorter version tomorrow."
    - "Tonight means no sleep, a shorter one might look rushed, two more days would give me room."
    - "I'll ask for two more days."
    - "Email her first thing tomorrow with a date I can actually meet."
    - "Yes, that feels manageable."
    - "My jaw feels less clenched."
    - "@tap:Chat More"
    - "Thanks."
- name: journey_act_choice_point
  expect_framework: true
  turns:
    - "My sister stopped speaking to me after an argument months ago and I can't make her talk to me."
    - "I cannot control whether she ever replies, and the thought that I ruined it keeps coming back."
    - "@accept|I don't want this deciding how I live."
    - "@accept|Yes, I'd like to choose how to deal with it."
    - "@accept|Okay."
    - "I can't make her reply, but I can decide what I do on my side."
    - "The thought that I ruined everything, and a sinking feeling whenever her birthday comes up."
    - "It pulls me toward avoiding the whole family so I don't have to face it."
    - "I want to be someone who stays close to the people I love, even when it's hard."
    - "Going to my mum's birthday dinner, even if it's awkward."
    - "I'll tell my mum today that I'm coming on Sunday."
    - "Yes, it feels like something I can actually do."
    - "My chest feels a little more open."
    - "@tap:Chat More"
    - "Thank you."
- name: journey_dbt_stop
  expect_framework: true
  turns:
    - "I'm about to send a message to my ex telling him exactly what I think of him."
    - "I've already written it and my thumb is on send, I know I'll regret it."
    - "@accept|I need help stopping myself."
    - "@accept|Yes, help me pause."
    - "@accept|Okay."
    - "Okay, I haven't sent it. It's still sitting there."
    - "I'm still here, I've moved it to drafts."
    - "My heart is racing and I keep replaying what he said last night."
    - "I'll leave it unsent tonight and decide tomorrow if I want to say anything."
    - "Yes, that feels better than sending it."
    - "My hands have stopped shaking a bit."
    - "@tap:Chat More"
    - "Thanks."

# Saying "Keep Chatting" to an offer, carrying on, and being offered something again once it fits.
- name: decline_then_reoffer
  turns:
    - "My manager criticized my presentation in front of the whole team."
    - "She said two of my recommendations didn't have enough support, and now I keep thinking I'm bad at my job."
    - "@tap:Keep Chatting"
    - "I just keep replaying her words."
    - "It's been going round in my head all day."
    - "I really can't shake the feeling I'm not good enough at this job."
    - "Honestly I think I'd like some help looking at it."

# A panic conversation reaching the body check from the last stage: Mani asks how they feel,
# offers the body check, guides it one step per turn, and asks again how they feel.
- name: panic_somatic_once
  start_in: {framework: dbt_stop, phase: closing}
  turns:
    - "it is better i guess"
    - "yes"
    - "ok"
    - "I can see my desk, a lamp and the window"
    - "I feel calmer for a second, then it comes back"
    - "still not great honestly"
