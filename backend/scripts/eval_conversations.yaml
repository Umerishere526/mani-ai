- name: journey_thought_reframe
  expect_framework: true
  turns:
    - "My friend hasn't replied to my message for two days."
    - "I keep thinking she doesn't care about me anymore."
    - "@accept|That thought won't leave me alone, I'd like to look at it."
    - "@accept|Yes, I want to work through it."
    - "@accept|Okay."
    - "That she doesn't care about me."
    - "It makes me feel like I don't matter to her."
    - "Well, she did start a new job this week."
    - "Maybe she's just swamped, not ignoring me."
    - "She's busy and hasn't replied yet, but that doesn't mean she doesn't care."
    - "Yes, that feels fairer."
    - "My stomach feels less tight than before."
    - "@tap:Chat More"
    - "Thanks."

# Offer to end for the frameworks with no journey above: one line per stage, in order.
- name: journey_structured_problem_solving
  expect_framework: true
  turns:
    - "I missed the report deadline at work and now there are three more things due this week."
    - "I don't know what to do first, everything is a mess and I need to make a plan."
    - "@accept|I really need a way through this week."
    - "@accept|Yes, let's work it out."
    - "@accept|Okay."
    - "The late report is the main thing, the rest can wait a day."
    - "My manager knows it's late, but I don't know when she needs it by now."
    - "I can ask her for a new date and decide what to drop this week."
    - "I want the report done properly without missing the other deadlines."
    - "I could finish it tonight, ask for two more days, or hand in a shorter version tomorrow."
    - "Tonight means no sleep, a shorter one might look rushed, two more days would give me room."
    - "I'll ask for two more days."
    - "Email her first thing tomorrow with a date I can actually meet."
    - "Yes, that feels manageable."
    - "My jaw feels less clenched."
    - "@tap:Chat More"
    - "Thanks."
- name: journey_act_choice_point
  expect_framework: true
  turns:
    - "My sister stopped speaking to me after an argument months ago and I can't make her talk to me."
    - "I cannot control whether she ever replies, and the thought that I ruined it keeps coming back."
    - "@accept|I don't want this deciding how I live."
    - "@accept|Yes, I'd like to choose how to deal with it."
    - "@accept|Okay."
    - "I can't make her reply, but I can decide what I do on my side."
    - "The thought that I ruined everything, and a sinking feeling whenever her birthday comes up."
    - "It pulls me toward avoiding the whole family so I don't have to face it."
    - "I want to be someone who stays close to the people I love, even when it's hard."
    - "Going to my mum's birthday dinner, even if it's awkward."
    - "I'll tell my mum today that I'm coming on Sunday."
    - "Yes, it feels like something I can actually do."
    - "My chest feels a little more open."
    - "@tap:Chat More"
    - "Thank you."
- name: journey_dbt_stop
  expect_framework: true
  turns:
    - "I'm about to send a message to my ex telling him exactly what I think of him."
    - "I've already written it and my thumb is on send, I know I'll regret it."
    - "@accept|I need help stopping myself."
    - "@accept|Yes, help me pause."
    - "@accept|Okay."
    - "Okay, I haven't sent it. It's still sitting there."
    - "I'm still here, I've moved it to drafts."
    - "My heart is racing and I keep replaying what he said last night."
    - "I'll leave it unsent tonight and decide tomorrow if I want to say anything."
    - "Yes, that feels better than sending it."
    - "My hands have stopped shaking a bit."
    - "@tap:Chat More"
    - "Thanks."

# Saying "Keep Chatting" to an offer, carrying on, and being offered something again once it fits.
- name: decline_then_reoffer
  turns:
    - "My manager criticized my presentation in front of the whole team."
    - "She said two of my recommendations didn't have enough support, and now I keep thinking I'm bad at my job."
    - "@tap:Keep Chatting"
    - "I just keep replaying her words."
    - "It's been going round in my head all day."
    - "I really can't shake the feeling I'm not good enough at this job."
    - "Honestly I think I'd like some help looking at it."

# A panic conversation reaching the body check from the last stage: Mani asks how they feel,
# offers the body check, guides it one step per turn, and asks again how they feel.
- name: panic_somatic_once
  start_in: {framework: dbt_stop, phase: closing}
  turns:
    - "it is better i guess"
    - "yes"
    - "ok"
    - "I can see my desk, a lamp and the window"
    - "I feel calmer for a second, then it comes back"
    - "still not great honestly"
# From thread 18757742, 2026-10-09: the cap passed E and its draft was answered on `closing`.
# Mani asks before the body check and gives no step until they say yes.
- name: abcde_closing_asks_before_body_check
  start_in: {framework: abcde, phase: closing}
  turns:
    - "yes i believe in myself"
    - "i feel ok"
    - "sure"
    - "laptop"

# Stages skip what the chat already told (spec 0010). A turn written `{say: <line>, expect_stage: <phase>}`
# checks the stage stored after that line. On the last `@accept` of a group it holds whichever one
# took the offer. The `@accept` fallbacks add nothing to any stage.
- name: stages_abcde_told_before_offer
  turns:
    - "My manager criticized my presentation in front of the whole team, and now I keep telling myself I'm bad at my job."
    - "I went quiet for the rest of the meeting and I've been avoiding her since."
    - "@accept|I'd like to work through it."
    - "@accept|Okay."
    - {say: "@accept|Okay, let's try it.", expect_stage: dispute}
# The same story, accepted by typing rather than tapping: it must land on the same stage.
- name: stages_abcde_free_text_yes
  turns:
    - "My manager criticized my presentation in front of the whole team, and now I keep telling myself I'm bad at my job."
    - "I went quiet for the rest of the meeting and I've been avoiding her since."
    - {say: "yeah let's do it", expect_stage: dispute}
# ABCDE is offered only once the meaning is known (its Starts when), so a vague meaning is
# checked inside a running ABCDE: B stays open and only what it came to mean is asked.
- name: stages_abcde_vague_meaning
  start_in: {framework: abcde, phase: activating_event}
  turns:
    - {say: "My manager criticized my presentation in front of the whole team yesterday.", expect_stage: belief}
    - {say: "I don't know, it just got to me.", expect_stage: belief}
# From the "left out of meetings" chat, 2026-10-09: what it meant, and both sides of D, told
# before the offer, C not. C is asked, then E, with no D question in between.
- name: stages_abcde_out_of_order
  turns:
    - "I keep getting left out of the planning meetings at work."
    - "It makes me think my team doesn't value me at all."
    - "They decide things without me and never ask what I think, so it seems true."
    - "Nope, no one has ever said a word against my work, and my last review was good."
    - "@accept|I'd like to work through it."
    - "@accept|Okay."
    - {say: "@accept|Okay, let's try it.", expect_stage: consequences}
    - {say: "I've gone quiet at work and I dread Mondays now.", expect_stage: effective_new_belief}
# One side of D only (what makes the belief seem true): D stays open and only its missing side is asked.
- name: stages_abcde_one_side_of_dispute
  turns:
    - "My friend cancelled our plans for the third time this month."
    - "I keep thinking I'm the one nobody wants around."
    - "Because of that thought I stayed in all weekend and felt awful."
    - "She's cancelled three times and she always seems busy when I ask, so it feels true."
    - "@accept|I'd like to work through it."
    - "@accept|Okay."
    - {say: "@accept|Okay, let's try it.", expect_stage: dispute}
# A stage that never becomes clear is passed after `stage_turn_cap` (3) turns and left behind.
- name: stages_abcde_stall
  start_in: {framework: abcde, phase: activating_event}
  turns:
    - {say: "My manager criticized my presentation in front of the whole team.", expect_stage: belief}
    - "I don't know."
    - {say: "I really can't say.", expect_stage: belief}
    - {say: "No idea, honestly.", expect_stage: consequences}

