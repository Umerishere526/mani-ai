# ABOUTME: Scripted conversations for scripts/eval_replies.py, one per named scenario.
# ABOUTME: Turns are drawn from the framework files' own worked examples where possible.

- name: anxiety_free_chat
  turns:
    - "I have a presentation tomorrow and I keep going over it"
    - "I keep thinking I'll freeze halfway through"
    - "I don't know, I just want it to be over"
    - "yeah maybe"
- name: criticism_abcde
  turns:
    - "My manager criticized my presentation in front of everyone"
    - "She said two of my recommendations did not have enough support"
    - "I stopped speaking and avoided her afterward"
    - "I keep thinking I am incompetent"
- name: withdrawal_behavioral_activation
  turns:
    - "I have been in bed all day"
    - "I have ignored everyone's messages for a week"
    - "I don't see the point"
    - "I guess I could answer one"

# A question is not what every moment needs. These turns are the ones where asking another
# would be the failure, so they are the only place the question-free shapes can be observed.
- name: disclosure_no_question_needed
  heard: true
  turns:
    - "nobody in my family knows about any of this"
    - "please don't give me a technique right now, I just need to get it out"
    - "I keep replaying the argument and I still can't see where it went wrong"
    - "that's all I wanted to say"

# The client's own worked scenarios (docs/specs/conversational-styles.md), user turns verbatim.
# Their MANI lines are the target: compare side by side with --verbose.
- name: client_anxiety
  turns:
    - "I feel like I might have a panic attack."
    - "My chest feels tight, my thoughts are racing, and I feel like I'm losing control."
    - "The feeling that I'm losing control."
- name: client_overthinking
  turns:
    - "I'm upset."
    - "My best friend sent me a text and now I think she hates me."
    - "She was really short with me and ended the conversation. Now I keep replaying it and wondering what I did wrong."
- name: client_scrolling
  turns:
    - "I cannot stop scrolling, but I need to."
    - "I have work due tomorrow and I've been on my phone for three hours."
    - "Every time I try to start I just pick the phone back up."
- name: client_stress
  turns:
    - "I'm trying to balance work, family, and everything else, and I have a deadline coming up."
    - "I don't know where to start."
    - "Mostly the deadline. It's on Friday and I haven't begun."

# Inside a framework: starts with ABCDE accepted, then answers its stages the way a person would.
- name: framework_abcde_stages
  start_in: {framework: abcde, phase: activate}
  turns:
    - "My manager criticized my presentation in front of the whole team."
    - "She said two of my recommendations didn't have enough support."
    - "That I'm bad at my job and everyone saw it."
    - "I stopped talking for the rest of the meeting and avoided her after."
    - "Well, she also asked me to lead the next project, so maybe not everyone thinks that."

# ---------------------------------------------------------------------------
# Demo rehearsal: whole journeys, improvised openings, and a returning person.
# `@accept|<line>` taps the offer when there is one, otherwise says <line>.
# `@tap:<label>` taps a named button. `@newchat` folds memory and opens a second chat.
# ---------------------------------------------------------------------------

- name: journey_abcde
  expect_framework: true
  turns:
    - "My manager criticized my presentation in front of the whole team."
    - "She said two of my recommendations didn't have enough support, and now I keep thinking I'm bad at my job."
    - "@accept|It keeps going round in my head and I'd like to work through it."
    - "@accept|Yes, I want to look at it properly."
    - "@accept|Okay."
    - "She said it in the meeting, right after my slides, in front of everyone."
    - "That I'm bad at my job and everyone saw it."
    - "I stopped talking for the rest of the meeting and avoided her afterwards."
    - "She also asked me to lead the next project, so maybe not everyone thinks that."
    - "Maybe one presentation had gaps, but it doesn't mean I'm bad at my job."
    - "Yes, that feels fairer."
    - "My shoulders feel a bit looser than when we started."
    - "@tap:Chat More"
    - "Thanks, that helped."

- name: journey_behavioral_activation
  expect_framework: true
  turns:
    - "I've been in bed most of the week and I've stopped answering my friends."
    - "I know I should get up and text them back but I can't make myself start."
    - "@accept|It's been like this for days and I want to change it."
    - "@accept|Yes, I'd like help with it."
    - "@accept|Okay."
    - "Replying to my friends, going for walks, cooking properly."
    - "My friends matter to me, I don't want to lose them."
    - "Replying to my friend Jo would be the one."
    - "Just sending her one short message."
    - "Tonight after dinner."
    - "I might feel embarrassed that I took so long, so I'll just say sorry I've been quiet."
    - "Yes, that feels doable."
    - "A bit lighter in my chest."
    - "@tap:Chat More"
    - "Thank you."

- name: open_breakup
  turns:
    - "My partner and I broke up last week."
    - "I keep checking my phone hoping they'll text."
    - "I just feel empty."
- name: open_exam
  turns:
    - "I have an exam on Friday and I can't focus."
    - "Every time I sit down I start thinking I'm going to fail."
    - "I studied but it never feels like enough."
- name: open_lonely_move
  turns:
    - "I moved to a new city a month ago and I don't really know anyone."
    - "Evenings are the worst."
    - "I'm not sure how people make friends as an adult."
- name: open_family_argument
  turns:
    - "I had a big argument with my mum."
    - "She said I never make time for the family."
    - "I'm annoyed but I also feel bad."
- name: open_sleep
  turns:
    - "I can't sleep."
    - "My mind won't switch off when I lie down."
    - "It's been like this for about two weeks."
- name: open_procrastination
  turns:
    - "I keep putting off a report that's due Monday."
    - "I open it and then I just go do something else."
    - "I don't even know why."
- name: open_unclear
  turns:
    - "I don't know what's wrong with me lately."
    - "I'm just not myself."
    - "Nothing specific happened."
- name: open_hi
  turns:
    - "hi"
    - "not much, just wanted to talk"
    - "work was long today."

- name: returning_person
  markers: ["sunday", "walk"]
  turns:
    - "I always feel low on Sunday nights before the work week starts."
    - "It's the dread of Monday, all the meetings."
    - "Going for a walk in the afternoon sometimes helps."
    - "@newchat"
    - "Hey, I'm back."
    - "Work has been stressful again this week."
    - "I don't really know what to do about it."

- name: journey_thought_reframe
  expect_framework: true
  turns:
    - "My friend hasn't replied to my message for two days."
    - "I keep thinking she doesn't care about me anymore."
    - "@accept|That thought won't leave me alone, I'd like to look at it."
    - "@accept|Yes, I want to work through it."
    - "@accept|Okay."
    - "That she doesn't care about me."
    - "It makes me feel like I don't matter to her."
    - "Well, she did start a new job this week."
    - "Maybe she's just swamped, not ignoring me."
    - "She's busy and hasn't replied yet, but that doesn't mean she doesn't care."
    - "Yes, that feels fairer."
    - "My stomach feels less tight than before."
    - "@tap:Chat More"
    - "Thanks."
