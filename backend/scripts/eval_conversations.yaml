# muhammad's chat, 2026-10-01: a lost wallet, panicking. Mani asked "is that the problem you want to
# resolve?", asked for the person's own options four times running, and only suggested anything at the
# end. Once a framework starts: no confirmation of what they just said, and an "I don't know" about
# what to do is met with a few concrete options, the urgent protective step first.
- name: lost_wallet_panic
  turns:
    - "i lost my wallet and i am panicking and anxious. my wallet had my ID card, credit cards and ATM cards and 2000 dollars in it"
    - "i don't remember, i visited many places today and called the restaurants i went to but none of them have it"
    - "@accept|yes please"
    - "@accept|yes"
    - "they are all active"
    - "i don't know"
    - "i don't know"
    - "please guide me, what should i do"

# Observed 2026-10-01 (muhammad's chat, comparing themselves with others online): after Try it Mani asked
# "why does getting back to doing things that feel productive matter?" before anything specific had
# been named, then answered "pick one for me" and "yes, but what should I start with?" with the same
# three options twice. The first stage is skipped only when it is answered, a request to pick gets one
# draft step to accept or change, and the framework still runs to its end.
- name: productive_cannot_choose
  expect_framework: true
  turns:
    - "today i don't feel it to win anything and just want to lay in my bed"
    - "I feel it in much behind everyone. like when i view the social media i see some people travel, some people flexing their money, their wealth and their easy life. it makes me feel small inside. i want to work for it, i procastinate and loss motivation. and sometimes i don't even want to try as i feel like i'm so behind why even bother with it."
    - "it like they have everything i.e money, fame, love, respect. everything basically."
    - "i want to do alot like make my day as productive as i can. but i just waste doom scrolling on social media or just lazying around."
    - "@accept|yes"
    - "@accept|yes"
    - "i feel like i should be learning new thing, exploring new opportunities, travel etc."
    - "i'm not sure. when ever i decide on a thing it feels like i just can't do it and quit before i even start."
    - "yes, they do what should i start with?"
    - "not sure can you please pick one for me."
    - "yes, but what should i start with?"
    - "yes that works"
    - "tomorrow morning after breakfast"
    - "i might pick up my phone and scroll instead"
    - "i'll put the phone in another room"
    - "yes it feels doable"
    - "yes, that is a realistic plan for me"
    - "my shoulders feel a bit looser"
    - "it was a good place to stop"

# A question is not what every moment needs. These turns are the ones where asking another
# would be the failure, so they are the only place the question-free shapes can be observed.
- name: disclosure_no_question_needed
  turns:
    - "nobody in my family knows about any of this"
    - "please don't give me a technique right now, I just need to get it out"
    - "I keep replaying the argument and I still can't see where it went wrong"
    - "that's all I wanted to say"

